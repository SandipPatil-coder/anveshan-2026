<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6ee" />
    <meta
      name="description"
      content="ANVESHAN 2026 — a Japan-themed techfest. Browse events, register your team, and get your QR entry pass."

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      /* Boot paint — shown before React mounts */
      #boot {
        position: fixed;
        inset: 0;
        background: #faf6ee;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #232028;
        font-family: "Zen Kaku Gothic New", sans-serif;
        font-weight: 900;
        letter-spacing: 0.3em;
        font-size: 12px;
      }
      #boot::before {
        content: "";
        width: 14px;
        height: 14px;
        border-radius: 999px;
        background: #c73e3a;
      }
    </style>
  </head>
  <body>
    <div id="boot">ANVESHAN 2026</div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
